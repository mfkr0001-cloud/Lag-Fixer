name: Build Lag Reducer (Android)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android64 mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: nightly

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagReducer-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
